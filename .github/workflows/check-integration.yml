name: Check production integration and deployment

on:
  push:
    branches: [codex/fix-ai-integration]
    paths:
      - .github/workflows/check-integration.yml
      - scripts/verify-production.mjs
      - scripts/verify-production.test.mjs
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: smartlog-production-diagnosis
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          path: SmartLogWeb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deployment verification
        run: node --test SmartLogWeb/scripts/verify-production.test.mjs
      - name: Find latest available production artifact
        id: artifact
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: 'production.yml', branch: 'master', status: 'completed', per_page: 10});
            for (const run of runs.data.workflow_runs) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: run.id});
              if (artifacts.data.artifacts.some(row => row.name === 'smartlog-production' && !row.expired)) {
                core.setOutput('run', String(run.id));
                return;
              }
            }
            core.warning('No unexpired production artifact is available for comparison.');
      - name: Read last production artifact for comparison
        if: steps.artifact.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          name: smartlog-production
          run-id: ${{ steps.artifact.outputs.run }}
          github-token: ${{ github.token }}
          path: SmartLogWeb/dist/SmartLogWeb/browser
      - name: Verify published site, API and APK
        if: steps.artifact.outputs.run != ''
        run: node SmartLogWeb/scripts/verify-production.mjs
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          repository: DeyvidJesus/SmartLogAPI
          ref: 247d7c2bbd7105868297e52d0930e68eb2a61c96
          path: SmartLogAPI
          token: ${{ secrets.SMARTLOG_REPOSITORY_TOKEN || github.token }}
      - run: npm ci --prefix SmartLogAPI/netlify
        if: github.event_name == 'workflow_dispatch'
      - name: Check live routing, Firebase identities and Gemini
        if: github.event_name == 'workflow_dispatch'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node SmartLogWeb/scripts/check-production-integration.mjs
