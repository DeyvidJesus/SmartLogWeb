<header class="top-header">
  <div class="header-left">
    <button
      id="admin-menu-toggle"
      type="button"
      class="admin-menu-toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="admin-navigation"
      [attr.aria-label]="menuOpen() ? 'Fechar navegação' : 'Abrir navegação'"
      (click)="menuToggle.emit()"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
    </button>
    <a routerLink="/home" class="brand-logo" aria-label="SmartLog, página inicial"><app-brand /></a>
    <span class="workspace-label">Painel de gestão</span>
  </div>
  <div class="header-right">
    <div class="tenant-chip" [title]="authService.empresaId()">
      <app-icon name="building" /><span>{{ authService.empresaId() }}</span>
    </div>
    <div class="user-chip">
      <div class="user-avatar" aria-hidden="true">{{ initials() }}</div>
      <div class="user-info">
        <span class="user-name">{{ authService.currentUser().nome }}</span
        ><span class="user-role">Administrador</span>
      </div>
    </div>
    <button type="button" class="logout-button" (click)="logout()">
      Sair <app-icon name="arrow-up-right" />
    </button>
  </div>
</header>
